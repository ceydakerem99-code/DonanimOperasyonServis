name: DonanimOperasyonServis
options:
  bundleIdPrefix: com.donanimoperasyonservis
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: tr
  generateEmptyDirectories: true
  groupSortPosition: top
  transitivelyLinkDependencies: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_MODULE_VERIFIER: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

targets:
  DonanimOperasyonServis:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: DonanimOperasyonServis
        excludes:
          - "**/.DS_Store"
          - "**/.gitkeep"
          - "**/*.plist.example"
          - "Resources/Info.plist"
          # Bundled explicitly below (gitignored; optional when absent).
          - "Resources/Firebase/GoogleService-Info.plist"
      # Firebase Console credential — must land in Copy Bundle Resources so
      # FirebaseAppBootstrapper can find Bundle.main "GoogleService-Info.plist".
      - path: DonanimOperasyonServis/Resources/Firebase/GoogleService-Info.plist
        buildPhase: resources
        optional: true
      - path: DonanimOperasyonServis/Resources/Generated/RealtimeGatewayHost.dev
        buildPhase: resources
        optional: true
    preBuildScripts:
      - name: Generate Realtime Gateway Host
        basedOnDependencyAnalysis: false
        shell: /bin/sh
        script: |
          set -eu
          GEN_DIR="${SRCROOT}/DonanimOperasyonServis/Resources/Generated"
          XCCONFIG_DIR="${SRCROOT}/Config/Generated"
          mkdir -p "${GEN_DIR}" "${XCCONFIG_DIR}"
          if [ "${CONFIGURATION:-Debug}" != "Debug" ]; then
            exit 0
          fi
          IP="$(ipconfig getifaddr en0 2>/dev/null || ipconfig getifaddr en1 2>/dev/null || true)"
          if [ -n "${IP}" ]; then
            printf '%s\n' "${IP}" > "${GEN_DIR}/RealtimeGatewayHost.dev"
            {
              echo "// Generated at build time — do not commit"
              echo "REALTIME_GATEWAY_HOST = ${IP}"
            } > "${XCCONFIG_DIR}/RealtimeGatewayHost.xcconfig"
          else
            : > "${GEN_DIR}/RealtimeGatewayHost.dev"
            {
              echo "// Generated at build time — do not commit"
              echo "REALTIME_GATEWAY_HOST ="
            } > "${XCCONFIG_DIR}/RealtimeGatewayHost.xcconfig"
          fi
        outputFiles:
          - $(SRCROOT)/Config/Generated/RealtimeGatewayHost.xcconfig
          - $(SRCROOT)/DonanimOperasyonServis/Resources/Generated/RealtimeGatewayHost.dev
    settings:
      base:
        PRODUCT_NAME: DonanimOperasyonServis
        PRODUCT_BUNDLE_IDENTIFIER: com.donanimoperasyonservis.app
        INFOPLIST_FILE: DonanimOperasyonServis/Resources/Info.plist
        DEVELOPMENT_ASSET_PATHS: "\"DonanimOperasyonServis/Preview Content\""
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        # Firebase Auth persists sessions in the Keychain. Unsigned
        # simulator builds fail with FIRAuth ERROR_KEYCHAIN_ERROR (-34018).
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: NO
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
    scheme:
      testTargets:
        - DonanimOperasyonServisTests
      gatherCoverageData: true

  DonanimOperasyonServisTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: DonanimOperasyonServisTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_NAME: DonanimOperasyonServisTests
        PRODUCT_BUNDLE_IDENTIFIER: com.donanimoperasyonservis.app.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: NO
    dependencies:
      - target: DonanimOperasyonServis
