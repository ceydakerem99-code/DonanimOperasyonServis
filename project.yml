name: DonanimOperasyonServis
options:
  bundleIdPrefix: com.donanimoperasyonservis
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: tr
  generateEmptyDirectories: true
  groupSortPosition: top
  transitivelyLinkDependencies: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_MODULE_VERIFIER: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

targets:
  DonanimOperasyonServis:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: DonanimOperasyonServis
        excludes:
          - "**/.DS_Store"
          - "**/.gitkeep"
          - "**/*.plist.example"
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_NAME: DonanimOperasyonServis
        PRODUCT_BUNDLE_IDENTIFIER: com.donanimoperasyonservis.app
        INFOPLIST_FILE: DonanimOperasyonServis/Resources/Info.plist
        DEVELOPMENT_ASSET_PATHS: "\"DonanimOperasyonServis/Preview Content\""
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
    scheme:
      testTargets:
        - DonanimOperasyonServisTests
      gatherCoverageData: true

  DonanimOperasyonServisTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: DonanimOperasyonServisTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_NAME: DonanimOperasyonServisTests
        PRODUCT_BUNDLE_IDENTIFIER: com.donanimoperasyonservis.app.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: DonanimOperasyonServis
